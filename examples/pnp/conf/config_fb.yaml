defaults:
  - physicsnemo_default
  - arch:
      - fbpinn
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: sum
  - _self_
arch:
  fbpinn:
    layer_size: 32
    nr_layers: 4
    nr_levels: 3
    subnet_arch_type: fourier
    activation_fn: tanh
    adaptive_activations: false
    window_fn: cosine
    overlap_ratio: 2.7
    refinement_factor: 2
    reduction_factor: 1
    subnet_kwargs:
      frequencies: ["axis", [0.2, 0.4, 1, 1.4, 2.6]]
      frequencies_params: ["axis", [0.2, 0.4, 1, 1.4, 2.6]]
    domain_bounds: [[0.0, 1.0], [0.0, 2.56]]
scheduler:
  decay_rate: 0.9
  decay_steps: 4000
optimizer:
  lr: 3.0e-4

training:
  rec_results_freq: 2000
  rec_validation_freq: 1000
  rec_inference_freq: 2000
  rec_monitor_freq: 1000
  rec_constraint_freq: 2000
  save_network_freq: 1000
  summary_freq: 1000
  max_steps : 60000
  print_stats_freq: 100
  grad_agg_freq: 1
  grad_clip_max_norm: 0.8
  ntk:
    use_ntk: false
    save_name: null
    run_freq: 10

batch_size:
  Initial: 2000
  Left: 2000
  Right: 2000
  Interior: 6000

hydra:
  job:
    chdir: true

cuda_graphs: true

graph:
  func_arch: false
  func_arch_allow_partial_hessian: false

custom:
  grid_sampling: false
  sdf: true
  quasirandom: true